name: Build unsigned IPA for Signulous

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project SignalField.xcodeproj \
            -scheme SignalField \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SignalField.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/SignalField.xcarchive/Products/Applications/SignalField.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/SignalField.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/SignalField-unsigned.ipa" Payload
          test -f "$GITHUB_WORKSPACE/SignalField-unsigned.ipa"

      - name: Upload IPA for Signulous
        uses: actions/upload-artifact@v4
        with:
          name: SignalField-unsigned-IPA
          path: SignalField-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
